name: Build verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build application
        run: npm run build
        env:
          # Build-time placeholders only; no live Supabase requests or credentials.
          NEXT_PUBLIC_SUPABASE_URL: https://build-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder-publishable-key

  notion-worker-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/notion-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck

  orchestrator-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Test intake policy helpers
        run: deno test supabase/functions/orchestrator-intake/policy_test.ts
      - name: Type-check intake Edge Function
        run: deno check supabase/functions/orchestrator-intake/index.ts
